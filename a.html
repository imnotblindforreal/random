<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio Scientific Calculator</title>
    <style>
:root {
    --bg-color: #121212;
    --calc-bg: #2a2d32;
    --screen-bg: #9ea894;
    --screen-text: #111111;
    --btn-num: #e0e0e0;
    --btn-num-text: #111111;
    --btn-op: #4a4e54;
    --btn-op-text: #ffffff;
    --btn-danger: #a83232;
    --btn-danger-text: #ffffff;
    --btn-accent: #2e6096;
    --btn-accent-text: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    user-select: none;
}

body {
    background-color: var(--bg-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 8px;
}

.calculator {
    background-color: var(--calc-bg);
    width: 100%;
    max-width: 360px;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.brand-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: #a0a0a0;
    padding: 0 4px;
}

.brand {
    font-weight: bold;
    font-size: 1.05rem;
    letter-spacing: 1px;
    color: #ffffff;
}

.model {
    font-size: 0.72rem;
}

/* LCD Display */
.display-container {
    background-color: var(--screen-bg);
    color: var(--screen-text);
    border-radius: 5px;
    padding: 8px;
    min-height: 125px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4);
    border: 2px solid #5d6655;
    position: relative;
    overflow-x: auto;
    overflow-y: visible;
}

.status-bar {
    display: flex;
    gap: 7px;
    font-size: 0.68rem;
    font-weight: bold;
    height: 12px;
}

.indicator {
    opacity: 0.15;
}

.indicator.active {
    opacity: 1;
}

.math-display {
    font-size: 1.08rem;
    min-height: 52px;
    padding: 6px 3px;
    display: flex;
    align-items: center;
    flex-wrap: nowrap;
    white-space: nowrap;
    overflow-x: auto;
    overflow-y: visible;
}

.math-display::-webkit-scrollbar {
    display: none;
}

.result-display {
    font-size: 1.25rem;
    text-align: right;
    font-weight: bold;
}

/* Keypad Grid Layout */
.keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
}

.btn {
    border: none;
    border-radius: 5px;
    padding: 10px 0;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2.5px 0 rgba(0, 0, 0, 0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: manipulation;
    width: 100%;
}

.btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
}

.btn-num {
    background-color: var(--btn-num);
    color: var(--btn-num-text);
}

.btn-op, .btn-sci, .btn-modifier, .btn-mode {
    background-color: var(--btn-op);
    color: var(--btn-op-text);
    font-size: 0.8rem;
}

.btn-danger {
    background-color: var(--btn-danger);
    color: var(--btn-danger-text);
}

.btn-equals {
    background-color: var(--btn-accent);
    color: var(--btn-accent-text);
}

/* D-Pad Layout in Grid */
.dpad-container {
    grid-column: span 2;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 2px;
    width: 100%;
    height: 100%;
}

.btn-dpad {
    background-color: #1a1c1e;
    color: #fff;
    font-size: 0.55rem;
    padding: 2px;
    border-radius: 3px;
    box-shadow: none;
}

.btn-dpad:nth-child(1) { grid-column: 2; grid-row: 1; } /* Up */
.btn-dpad:nth-child(2) { grid-column: 1; grid-row: 2; } /* Left */
.btn-dpad:nth-child(3) { grid-column: 3; grid-row: 2; } /* Right */
.btn-dpad:nth-child(4) { grid-column: 2; grid-row: 2; } /* Down */

/* Math AST Elements Rendering */
.node-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 12px;
    min-height: 18px;
    margin: 0 1px;
    padding: 1px;
    vertical-align: middle;
}

.node-slot.empty {
    border: 1px dashed #444;
    background-color: rgba(0, 0, 0, 0.05);
}

.cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background-color: #000;
    vertical-align: middle;
    animation: blink 1s infinite;
    margin: 0 -1px;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

.node-fraction {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    padding: 1px 3px;
    margin: 0 1px;
}

.node-fraction-num {
    border-bottom: 1.5px solid #000;
    padding-bottom: 1px;
    text-align: center;
    width: 100%;
    min-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.node-fraction-den {
    padding-top: 1px;
    text-align: center;
    width: 100%;
    min-height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.node-sqrt {
    display: inline-flex;
    align-items: center;
    vertical-align: middle;
}

.node-sqrt-symbol {
    font-size: 1em;
    padding-right: 1px;
}

.node-sqrt-radicand {
    border-top: 1.5px solid #000;
    padding-top: 1px;
}

.node-power {
    display: inline-flex;
    align-items: flex-start;
    vertical-align: middle;
}

.node-power-exp {
    font-size: 0.7em;
    vertical-align: super;
    position: relative;
    top: -0.35em;
}

/* System Node Display */
.node-system {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
}

.system-row {
    display: inline-flex;
    align-items: center;
}

.dotted-box {
    display: inline-flex;
    align-items: center;
    border: 1px dotted #111;
    padding: 1px 3px;
    margin: 0 2px;
    background-color: rgba(0, 0, 0, 0.03);
}
    </style>
</head>
<body>
    <div class="calculator">
        <div class="brand-header">
            <div class="brand">CASIO</div>
            <div class="model">fx-BLIND-GUY <i>PLUS</i></div>
        </div>

        <!-- Screen Display -->
        <div class="display-container">
            <div class="status-bar">
                <span id="ind-shift" class="indicator">S</span>
                <span id="ind-alpha" class="indicator">A</span>
                <span id="ind-m" class="indicator">M</span>
                <span id="ind-angle" class="indicator active">DEG</span>
            </div>
            <div id="math-display" class="math-display"></div>
            <div id="result-display" class="result-display">0</div>
        </div>

        <!-- Keypad -->
        <div class="keypad">
            <button class="btn btn-modifier" data-action="shift">SHIFT</button>
            <button class="btn btn-modifier" data-action="alpha">ALPHA</button>
            <div class="dpad-container">
                <button class="btn btn-dpad" data-action="nav-up" aria-label="Up">▲</button>
                <button class="btn btn-dpad" data-action="nav-left" aria-label="Left">←</button>
                <button class="btn btn-dpad" data-action="nav-right" aria-label="Right">→</button>
                <button class="btn btn-dpad" data-action="nav-down" aria-label="Down">▼</button>
            </div>
            <button class="btn btn-mode" data-action="toggle-angle">MODE</button>
            <button class="btn btn-sci" data-action="fraction" aria-label="Fraction"><sup>□</sup>/<sub>□</sub></button>
            <button class="btn btn-sci" data-action="sqrt" aria-label="Square Root">√□</button>
            <button class="btn btn-sci" data-action="power" aria-label="Power">x<sup>□</sup></button>
            <button class="btn btn-sci" data-action="calc">CALC</button>
            <button class="btn btn-sci" data-action="toggle-approx">S⇔D</button>
            <button class="btn btn-sci" data-action="func" data-value="sin">sin</button>
            <button class="btn btn-sci" data-action="func" data-value="cos">cos</button>
            <button class="btn btn-sci" data-action="func" data-value="tan">tan</button>
            <button class="btn btn-sci" data-action="system">SOLVE</button>
            <button class="btn btn-sci" data-action="func" data-value="ln">ln</button>
            <button class="btn btn-sci" data-action="char" data-value="(">(</button>
            <button class="btn btn-sci" data-action="var" data-value="X">X</button>
            <button class="btn btn-sci" data-action="var" data-value="Y">Y</button>
            <button class="btn btn-sci" data-action="const" data-value="π">π</button>
            <button class="btn btn-sci" data-action="const" data-value="e">e</button>
            <button class="btn btn-num" data-action="digit" data-value="7">7</button>
            <button class="btn btn-num" data-action="digit" data-value="8">8</button>
            <button class="btn btn-num" data-action="digit" data-value="9">9</button>
            <button class="btn btn-danger" data-action="delete" aria-label="Delete">DEL</button>
            <button class="btn btn-danger" data-action="clear-all" aria-label="All Clear">AC</button>
            <button class="btn btn-num" data-action="digit" data-value="4">4</button>
            <button class="btn btn-num" data-action="digit" data-value="5">5</button>
            <button class="btn btn-num" data-action="digit" data-value="6">6</button>
            <button class="btn btn-op" data-action="op" data-value="*">×</button>
            <button class="btn btn-op" data-action="op" data-value="/">÷</button>
            <button class="btn btn-num" data-action="digit" data-value="1">1</button>
            <button class="btn btn-num" data-action="digit" data-value="2">2</button>
            <button class="btn btn-num" data-action="digit" data-value="3">3</button>
            <button class="btn btn-op" data-action="op" data-value="+">+</button>
            <button class="btn btn-op" data-action="op" data-value="-">-</button>
            <button class="btn btn-num" data-action="digit" data-value="0">0</button>
            <button class="btn btn-num" data-action="digit" data-value=".">.</button>
            <button class="btn btn-sci" data-action="ans">Ans</button>
            <button class="btn btn-equals" data-action="calculate">=</button>
        </div>
    </div>

    <script>
let idCounter = 0;
const genId = () => `node_${++idCounter}`;

class ASTNode {
    constructor(type, props = {}) {
        this.id = genId();
        this.type = type;
        Object.assign(this, props);
    }
}

function createSlot() {
    return new ASTNode('slot', { children: [] });
}

function createFraction() {
    return new ASTNode('fraction', { num: createSlot(), den: createSlot() });
}

function createSqrt() {
    return new ASTNode('sqrt', { radicand: createSlot() });
}

function createPower() {
    return new ASTNode('power', { base: createSlot(), exp: createSlot() });
}

function createFunction(name) {
    return new ASTNode('func', { name: name, arg: createSlot() });
}

function createGroup() {
    return new ASTNode('group', { expr: createSlot() });
}

function createSystemNode() {
    return new ASTNode('system', {
        a: createSlot(), b: createSlot(), c: createSlot(),
        d: createSlot(), e: createSlot(), f: createSlot()
    });
}

class CalculatorState {
    constructor() {
        this.rootSlot = createSlot();
        this.cursor = { slotId: this.rootSlot.id, offset: 0 };
        this.angleMode = 'DEG';
        this.shift = false;
        this.alpha = false;
        this.ans = 0;
        this.vars = { X: 0, Y: 0 };
        this.lastResult = null;
        this.showApprox = false;
    }

    resetExpression() {
        this.rootSlot = createSlot();
        this.cursor = { slotId: this.rootSlot.id, offset: 0 };
        this.lastResult = null;
        this.showApprox = false;
    }
}

class ASTUtils {
    static findSlot(node, slotId) {
        if (node.type === 'slot') {
            if (node.id === slotId) return node;
            for (const child of node.children) {
                const found = ASTUtils.findSlot(child, slotId);
                if (found) return found;
            }
        } else {
            for (const key of ['num', 'den', 'radicand', 'base', 'exp', 'arg', 'expr', 'a', 'b', 'c', 'd', 'e', 'f']) {
                if (node[key]) {
                    const found = ASTUtils.findSlot(node[key], slotId);
                    if (found) return found;
                }
            }
        }
        return null;
    }

    static getSlotOwnerNode(node, targetSlotId) {
        if (node.type === 'slot') {
            for (const child of node.children) {
                const found = ASTUtils.getSlotOwnerNode(child, targetSlotId);
                if (found) return found;
            }
        } else {
            for (const key of ['num', 'den', 'radicand', 'base', 'exp', 'arg', 'expr', 'a', 'b', 'c', 'd', 'e', 'f']) {
                if (node[key]) {
                    if (node[key].id === targetSlotId) return node;
                    const found = ASTUtils.getSlotOwnerNode(node[key], targetSlotId);
                    if (found) return found;
                }
            }
        }
        return null;
    }

    static getNodeParentSlot(node, targetNodeId) {
        if (node.type === 'slot') {
            for (let i = 0; i < node.children.length; i++) {
                const child = node.children[i];
                if (child.id === targetNodeId) {
                    return { slot: node, index: i };
                }
                const found = ASTUtils.getNodeParentSlot(child, targetNodeId);
                if (found) return found;
            }
        } else {
            for (const key of ['num', 'den', 'radicand', 'base', 'exp', 'arg', 'expr', 'a', 'b', 'c', 'd', 'e', 'f']) {
                if (node[key]) {
                    const found = ASTUtils.getNodeParentSlot(node[key], targetNodeId);
                    if (found) return found;
                }
            }
        }
        return null;
    }

    static collectVariables(slotNode) {
        const vars = new Set();
        const traverse = (node) => {
            if (node.type === 'variable') vars.add(node.name);
            if (node.children) node.children.forEach(traverse);
            for (const key of ['num', 'den', 'radicand', 'base', 'exp', 'arg', 'expr', 'a', 'b', 'c', 'd', 'e', 'f']) {
                if (node[key]) traverse(node[key]);
            }
        };
        traverse(slotNode);
        return Array.from(vars);
    }

    static gcd(a, b) {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b) {
            const t = b;
            b = a % b;
            a = t;
        }
        return a;
    }

    static floatToFraction(val, maxDenominator = 1000000) {
        if (!isFinite(val) || isNaN(val)) return null;
        const sign = val < 0 ? -1 : 1;
        const target = Math.abs(val);

        let h1 = 1, h2 = 0;
        let k1 = 0, k2 = 1;
        let b = target;

        do {
            const a = Math.floor(b);
            let aux = h1;
            h1 = a * h1 + h2;
            h2 = aux;
            aux = k1;
            k1 = a * k1 + k2;
            k2 = aux;

            if (Math.abs(target - h1 / k1) < 1e-9) break;
            b = 1 / (b - a);
        } while (k1 <= maxDenominator && isFinite(b));

        const num = sign * h1;
        const den = k1;
        const g = ASTUtils.gcd(num, den);
        return { num: num / g, den: den / g };
    }
}

class ExpressionRenderer {
    static render(rootSlot, cursorState) {
        const container = document.createElement('div');
        container.className = 'ast-root';
        ExpressionRenderer.renderSlot(rootSlot, container, cursorState);
        return container;
    }

    static renderSlot(slotNode, parentEl, cursorState) {
        const slotEl = document.createElement('span');
        slotEl.className = 'node-slot';
        slotEl.dataset.slotId = slotNode.id;
        if (slotNode.children.length === 0) slotEl.classList.add('empty');

        const isCursorInSlot = cursorState.slotId === slotNode.id;

        if (isCursorInSlot && cursorState.offset === 0) {
            slotEl.appendChild(ExpressionRenderer.createCursorEl());
        }

        slotNode.children.forEach((child, index) => {
            ExpressionRenderer.renderNode(child, slotEl, cursorState);
            if (isCursorInSlot && cursorState.offset === index + 1) {
                slotEl.appendChild(ExpressionRenderer.createCursorEl());
            }
        });

        parentEl.appendChild(slotEl);
    }

    static renderNode(node, parentEl, cursorState) {
        const nodeEl = document.createElement('span');
        nodeEl.dataset.nodeId = node.id;

        switch (node.type) {
            case 'number':
            case 'operator':
            case 'symbol':
            case 'variable':
                nodeEl.textContent = node.value || node.name;
                parentEl.appendChild(nodeEl);
                break;

            case 'fraction':
                nodeEl.className = 'node-fraction';
                const numEl = document.createElement('div');
                numEl.className = 'node-fraction-num';
                ExpressionRenderer.renderSlot(node.num, numEl, cursorState);

                const denEl = document.createElement('div');
                denEl.className = 'node-fraction-den';
                ExpressionRenderer.renderSlot(node.den, denEl, cursorState);

                nodeEl.appendChild(numEl);
                nodeEl.appendChild(denEl);
                parentEl.appendChild(nodeEl);
                break;

            case 'sqrt':
                nodeEl.className = 'node-sqrt';
                const symEl = document.createElement('span');
                symEl.className = 'node-sqrt-symbol';
                symEl.textContent = '√';

                const radEl = document.createElement('span');
                radEl.className = 'node-sqrt-radicand';
                ExpressionRenderer.renderSlot(node.radicand, radEl, cursorState);

                nodeEl.appendChild(symEl);
                nodeEl.appendChild(radEl);
                parentEl.appendChild(nodeEl);
                break;

            case 'power':
                nodeEl.className = 'node-power';
                const baseEl = document.createElement('span');
                ExpressionRenderer.renderSlot(node.base, baseEl, cursorState);

                const expEl = document.createElement('span');
                expEl.className = 'node-power-exp';
                ExpressionRenderer.renderSlot(node.exp, expEl, cursorState);

                nodeEl.appendChild(baseEl);
                nodeEl.appendChild(expEl);
                parentEl.appendChild(nodeEl);
                break;

            case 'func':
                nodeEl.textContent = node.name + '(';
                parentEl.appendChild(nodeEl);
                ExpressionRenderer.renderSlot(node.arg, parentEl, cursorState);
                const closeParen = document.createElement('span');
                closeParen.textContent = ')';
                parentEl.appendChild(closeParen);
                break;

            case 'group':
                const openEl = document.createElement('span');
                openEl.textContent = '(';
                parentEl.appendChild(openEl);
                ExpressionRenderer.renderSlot(node.expr, parentEl, cursorState);
                const closeEl = document.createElement('span');
                closeEl.textContent = ')';
                parentEl.appendChild(closeEl);
                break;

            case 'system':
                nodeEl.className = 'node-system';
                const renderRow = (v1, slot1, v2, slot2, slot3) => {
                    const row = document.createElement('div');
                    row.className = 'system-row';

                    const box1 = document.createElement('div');
                    box1.className = 'dotted-box';
                    box1.appendChild(document.createTextNode(`${v1}=`));
                    ExpressionRenderer.renderSlot(slot1, box1, cursorState);

                    const box2 = document.createElement('div');
                    box2.className = 'dotted-box';
                    box2.appendChild(document.createTextNode(`${v2}=`));
                    ExpressionRenderer.renderSlot(slot2, box2, cursorState);

                    const txtX = document.createElement('span');
                    txtX.textContent = `X + `;
                    const txtY = document.createElement('span');
                    txtY.textContent = `Y = `;

                    row.appendChild(box1);
                    row.appendChild(txtX);
                    row.appendChild(box2);
                    row.appendChild(txtY);
                    ExpressionRenderer.renderSlot(slot3, row, cursorState);
                    return row;
                };

                nodeEl.appendChild(renderRow('x', node.a, 'y', node.b, node.c));
                nodeEl.appendChild(renderRow('x', node.d, 'y', node.e, node.f));
                parentEl.appendChild(nodeEl);
                break;
        }
    }

    static createCursorEl() {
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        return cursor;
    }
}

class NavigationEngine {
    constructor(state) {
        this.state = state;
    }

    navigateLeft() {
        const { slotId, offset } = this.state.cursor;
        const currentSlot = ASTUtils.findSlot(this.state.rootSlot, slotId);
        if (!currentSlot) return;

        if (offset > 0) {
            const nodeToLeft = currentSlot.children[offset - 1];
            if (nodeToLeft.type === 'fraction') {
                this.setCursor(nodeToLeft.den.id, nodeToLeft.den.children.length);
            } else if (nodeToLeft.type === 'sqrt') {
                this.setCursor(nodeToLeft.radicand.id, nodeToLeft.radicand.children.length);
            } else if (nodeToLeft.type === 'power') {
                this.setCursor(nodeToLeft.exp.id, nodeToLeft.exp.children.length);
            } else if (nodeToLeft.type === 'func') {
                this.setCursor(nodeToLeft.arg.id, nodeToLeft.arg.children.length);
            } else if (nodeToLeft.type === 'group') {
                this.setCursor(nodeToLeft.expr.id, nodeToLeft.expr.children.length);
            } else if (nodeToLeft.type === 'system') {
                this.setCursor(nodeToLeft.f.id, nodeToLeft.f.children.length);
            } else {
                this.state.cursor.offset--;
            }
        } else {
            const ownerNode = ASTUtils.getSlotOwnerNode(this.state.rootSlot, slotId);
            if (ownerNode) {
                if (ownerNode.type === 'fraction' && slotId === ownerNode.den.id) {
                    this.setCursor(ownerNode.num.id, ownerNode.num.children.length);
                } else if (ownerNode.type === 'system') {
                    const sysOrder = [ownerNode.a.id, ownerNode.b.id, ownerNode.c.id, ownerNode.d.id, ownerNode.e.id, ownerNode.f.id];
                    const idx = sysOrder.indexOf(slotId);
                    if (idx > 0) {
                        const prevSlot = ASTUtils.findSlot(this.state.rootSlot, sysOrder[idx - 1]);
                        this.setCursor(prevSlot.id, prevSlot.children.length);
                    } else {
                        const parentSlotInfo = ASTUtils.getNodeParentSlot(this.state.rootSlot, ownerNode.id);
                        if (parentSlotInfo) this.setCursor(parentSlotInfo.slot.id, parentSlotInfo.index);
                    }
                } else {
                    const parentSlotInfo = ASTUtils.getNodeParentSlot(this.state.rootSlot, ownerNode.id);
                    if (parentSlotInfo) {
                        this.setCursor(parentSlotInfo.slot.id, parentSlotInfo.index);
                    }
                }
            }
        }
    }

    navigateRight() {
        const { slotId, offset } = this.state.cursor;
        const currentSlot = ASTUtils.findSlot(this.state.rootSlot, slotId);
        if (!currentSlot) return;

        if (offset < currentSlot.children.length) {
            const nodeToRight = currentSlot.children[offset];
            if (nodeToRight.type === 'fraction') {
                this.setCursor(nodeToRight.num.id, 0);
            } else if (nodeToRight.type === 'sqrt') {
                this.setCursor(nodeToRight.radicand.id, 0);
            } else if (nodeToRight.type === 'power') {
                this.setCursor(nodeToRight.base.id, 0);
            } else if (nodeToRight.type === 'func') {
                this.setCursor(nodeToRight.arg.id, 0);
            } else if (nodeToRight.type === 'group') {
                this.setCursor(nodeToRight.expr.id, 0);
            } else if (nodeToRight.type === 'system') {
                this.setCursor(nodeToRight.a.id, 0);
            } else {
                this.state.cursor.offset++;
            }
        } else {
            const ownerNode = ASTUtils.getSlotOwnerNode(this.state.rootSlot, slotId);
            if (ownerNode) {
                if (ownerNode.type === 'fraction' && slotId === ownerNode.num.id) {
                    this.setCursor(ownerNode.den.id, 0);
                } else if (ownerNode.type === 'system') {
                    const sysOrder = [ownerNode.a.id, ownerNode.b.id, ownerNode.c.id, ownerNode.d.id, ownerNode.e.id, ownerNode.f.id];
                    const idx = sysOrder.indexOf(slotId);
                    if (idx !== -1 && idx < sysOrder.length - 1) {
                        this.setCursor(sysOrder[idx + 1], 0);
                    } else {
                        const parentSlotInfo = ASTUtils.getNodeParentSlot(this.state.rootSlot, ownerNode.id);
                        if (parentSlotInfo) this.setCursor(parentSlotInfo.slot.id, parentSlotInfo.index + 1);
                    }
                } else {
                    const parentSlotInfo = ASTUtils.getNodeParentSlot(this.state.rootSlot, ownerNode.id);
                    if (parentSlotInfo) {
                        this.setCursor(parentSlotInfo.slot.id, parentSlotInfo.index + 1);
                    }
                }
            }
        }
    }

    navigateUp() {
        const { slotId } = this.state.cursor;
        const ownerNode = ASTUtils.getSlotOwnerNode(this.state.rootSlot, slotId);

        if (ownerNode) {
            if (ownerNode.type === 'fraction' && slotId === ownerNode.den.id) {
                this.setCursor(ownerNode.num.id, Math.min(this.state.cursor.offset, ownerNode.num.children.length));
                return;
            }
            if (ownerNode.type === 'power' && slotId === ownerNode.base.id) {
                this.setCursor(ownerNode.exp.id, 0);
                return;
            }
            if (ownerNode.type === 'system') {
                if (slotId === ownerNode.d.id) this.setCursor(ownerNode.a.id, 0);
                else if (slotId === ownerNode.e.id) this.setCursor(ownerNode.b.id, 0);
                else if (slotId === ownerNode.f.id) this.setCursor(ownerNode.c.id, 0);
            }
        }
    }

    navigateDown() {
        const { slotId } = this.state.cursor;
        const ownerNode = ASTUtils.getSlotOwnerNode(this.state.rootSlot, slotId);

        if (ownerNode) {
            if (ownerNode.type === 'fraction' && slotId === ownerNode.num.id) {
                this.setCursor(ownerNode.den.id, Math.min(this.state.cursor.offset, ownerNode.den.children.length));
                return;
            }
            if (ownerNode.type === 'power' && slotId === ownerNode.exp.id) {
                this.setCursor(ownerNode.base.id, ownerNode.base.children.length);
                return;
            }
            if (ownerNode.type === 'system') {
                if (slotId === ownerNode.a.id) this.setCursor(ownerNode.d.id, 0);
                else if (slotId === ownerNode.b.id) this.setCursor(ownerNode.e.id, 0);
                else if (slotId === ownerNode.c.id) this.setCursor(ownerNode.f.id, 0);
            }
        }
    }

    setCursor(slotId, offset) {
        this.state.cursor.slotId = slotId;
        this.state.cursor.offset = offset;
    }
}

class EvaluationEngine {
    static evaluate(slotNode, state) {
        const children = slotNode.children;
        if (children.length === 1 && children[0].type === 'system') {
            const sys = children[0];
            const a = EvaluationEngine.evaluate(sys.a, state);
            const b = EvaluationEngine.evaluate(sys.b, state);
            const c = EvaluationEngine.evaluate(sys.c, state);
            const d = EvaluationEngine.evaluate(sys.d, state);
            const e = EvaluationEngine.evaluate(sys.e, state);
            const f = EvaluationEngine.evaluate(sys.f, state);

            const det = a * e - b * d;
            const detX = c * e - b * f;
            const detY = a * f - c * d;

            const eps = 1e-10;
            if (Math.abs(det) < eps) {
                if (Math.abs(detX) < eps && Math.abs(detY) < eps) {
                    return "Inf solutions";
                } else {
                    return "No solution";
                }
            }

            const x = detX / det;
            const y = detY / det;
            return { x, y };
        }

        const activeVars = ASTUtils.collectVariables(slotNode);
        const hasEquals = slotNode.children.some(c => c.type === 'symbol' && c.value === '=');

        if (hasEquals && activeVars.length === 1) {
            const varName = activeVars[0];
            
            const evalWithVar = (val) => {
                const tempState = Object.assign({}, state, {
                    vars: Object.assign({}, state.vars, { [varName]: val })
                });
                const tokens = EvaluationEngine.toTokens(slotNode, tempState);
                const eqIdx = tokens.findIndex(t => t.type === 'eq');
                if (eqIdx === -1) throw new Error("Syntax ERROR");

                const leftTokens = tokens.slice(0, eqIdx);
                const rightTokens = tokens.slice(eqIdx + 1);
                
                if (leftTokens.length === 0 || rightTokens.length === 0) {
                    throw new Error("Syntax ERROR");
                }

                const leftVal = EvaluationEngine.evalTree(EvaluationEngine.parseTokens(leftTokens), tempState);
                const rightVal = EvaluationEngine.evalTree(EvaluationEngine.parseTokens(rightTokens), tempState);
                return leftVal - rightVal;
            };

            const f0 = evalWithVar(0);
            const f1 = evalWithVar(1);
            const slope = f1 - f0;

            if (Math.abs(slope) < 1e-11) {
                return Math.abs(f0) < 1e-11 ? "Inf solutions" : "No solution";
            }

            const sol = -f0 / slope;
            return { [varName.toLowerCase()]: sol };
        }

        const tokens = EvaluationEngine.toTokens(slotNode, state);
        if (tokens.length === 0) return 0;

        const eqIndex = tokens.findIndex(t => t.type === 'eq');
        if (eqIndex !== -1) {
            const leftTokens = tokens.slice(0, eqIndex);
            const rightTokens = tokens.slice(eqIndex + 1);
            if (leftTokens.length === 0 || rightTokens.length === 0) {
                throw new Error("Syntax ERROR");
            }

            const leftVal = EvaluationEngine.evalTree(EvaluationEngine.parseTokens(leftTokens), state);
            const rightVal = EvaluationEngine.evalTree(EvaluationEngine.parseTokens(rightTokens), state);
            return Math.abs(leftVal - rightVal) < 1e-11 ? 1 : 0;
        }

        const parseTree = EvaluationEngine.parseTokens(tokens);
        return EvaluationEngine.evalTree(parseTree, state);
    }

    static toTokens(slotNode, state) {
        let tokens = [];
        const children = slotNode.children;
        let i = 0;

        while (i < children.length) {
            const child = children[i];

            const needsImplicitMult = () => {
                if (tokens.length === 0) return false;
                const last = tokens[tokens.length - 1];
                return last.type === 'num';
            };

            if (child.type === 'number') {
                let numStr = '';
                while (i < children.length && children[i].type === 'number') {
                    numStr += children[i].value;
                    i++;
                }
                if (needsImplicitMult()) tokens.push({ type: 'op', value: '*' });
                const parsedNum = parseFloat(numStr);
                if (isNaN(parsedNum)) throw new Error("Syntax ERROR");
                tokens.push({ type: 'num', value: parsedNum });
                continue;
            }

            if (child.type === 'symbol') {
                if (child.value === '=') {
                    tokens.push({ type: 'eq', value: '=' });
                    i++;
                    continue;
                }
                let val = 0;
                if (child.value === 'π') val = Math.PI;
                else if (child.value === 'e') val = Math.E;
                else if (child.value === 'Ans') val = state.ans;

                if (needsImplicitMult()) tokens.push({ type: 'op', value: '*' });
                tokens.push({ type: 'num', value: val });
                i++;
                continue;
            }

            if (child.type === 'variable') {
                const val = state.vars[child.name] !== undefined ? state.vars[child.name] : 0;
                if (needsImplicitMult()) tokens.push({ type: 'op', value: '*' });
                tokens.push({ type: 'num', value: val });
                i++;
                continue;
            }

            if (child.type === 'operator') {
                tokens.push({ type: 'op', value: child.value });
                i++;
                continue;
            }

            if (child.type === 'fraction') {
                if (needsImplicitMult()) tokens.push({ type: 'op', value: '*' });
                const numVal = EvaluationEngine.evaluate(child.num, state);
                const denVal = EvaluationEngine.evaluate(child.den, state);
                if (denVal === 0) throw new Error("Math ERROR");
                tokens.push({ type: 'num', value: numVal / denVal });
                i++;
                continue;
            }

            if (child.type === 'sqrt') {
                if (needsImplicitMult()) tokens.push({ type: 'op', value: '*' });
                const radVal = EvaluationEngine.evaluate(child.radicand, state);
                if (radVal < 0) throw new Error("Math ERROR");
                tokens.push({ type: 'num', value: Math.sqrt(radVal) });
                i++;
                continue;
            }

            if (child.type === 'power') {
                if (needsImplicitMult()) tokens.push({ type: 'op', value: '*' });
                const baseVal = EvaluationEngine.evaluate(child.base, state);
                const expVal = EvaluationEngine.evaluate(child.exp, state);
                tokens.push({ type: 'num', value: Math.pow(baseVal, expVal) });
                i++;
                continue;
            }

            if (child.type === 'func') {
                if (needsImplicitMult()) tokens.push({ type: 'op', value: '*' });
                const argVal = EvaluationEngine.evaluate(child.arg, state);
                tokens.push({ type: 'num', value: EvaluationEngine.evalFunc(child.name, argVal, state.angleMode) });
                i++;
                continue;
            }

            if (child.type === 'group') {
                if (needsImplicitMult()) tokens.push({ type: 'op', value: '*' });
                const groupVal = EvaluationEngine.evaluate(child.expr, state);
                tokens.push({ type: 'num', value: groupVal });
                i++;
                continue;
            }

            i++;
        }
        return tokens;
    }

    static evalFunc(name, arg, angleMode) {
        let rad = arg;
        if (['sin', 'cos', 'tan'].includes(name)) {
            if (angleMode === 'DEG') rad = (arg * Math.PI) / 180;
            else if (angleMode === 'GRAD') rad = (arg * Math.PI) / 200;
        }
        switch (name) {
            case 'sin': return Math.sin(rad);
            case 'cos': return Math.cos(rad);
            case 'tan': return Math.tan(rad);
            case 'log': return Math.log10(arg);
            case 'ln': return Math.log(arg);
            default: return arg;
        }
    }

    static parseTokens(tokens) {
        const outputQueue = [];
        const operatorStack = [];
        const precedence = { '+': 1, '-': 1, '*': 2, '/': 2, 'u-': 3 };
        const associativity = { '+': 'L', '-': 'L', '*': 'L', '/': 'L', 'u-': 'R' };

        for (let i = 0; i < tokens.length; i++) {
            const token = tokens[i];
            if (token.type === 'num') {
                outputQueue.push(token);
            } else if (token.type === 'op') {
                let opVal = token.value;
                if (opVal === '-') {
                    const prev = i > 0 ? tokens[i - 1] : null;
                    if (!prev || prev.type === 'op') {
                        opVal = 'u-';
                    }
                }

                while (operatorStack.length > 0) {
                    const top = operatorStack[operatorStack.length - 1];
                    if (top.type === 'op') {
                        const p1 = precedence[opVal];
                        const p2 = precedence[top.value];
                        if ((associativity[opVal] === 'L' && p1 <= p2) || (associativity[opVal] === 'R' && p1 < p2)) {
                            outputQueue.push(operatorStack.pop());
                            continue;
                        }
                    }
                    break;
                }
                operatorStack.push({ type: 'op', value: opVal });
            }
        }

        while (operatorStack.length > 0) {
            outputQueue.push(operatorStack.pop());
        }

        return outputQueue;
    }

    static evalTree(tokens, state) {
        const stack = [];
        tokens.forEach(token => {
            if (token.type === 'num') {
                stack.push(token.value);
            } else if (token.type === 'op') {
                if (token.value === 'u-') {
                    const a = stack.pop() ?? 0;
                    stack.push(-a);
                } else {
                    const b = stack.pop() ?? 0;
                    const a = stack.pop() ?? 0;
                    switch (token.value) {
                        case '+': stack.push(a + b); break;
                        case '-': stack.push(a - b); break;
                        case '*': stack.push(a * b); break;
                        case '/': 
                            if (b === 0) throw new Error("Math ERROR");
                            stack.push(a / b); 
                            break;
                    }
                }
            }
        });

        if (stack.length === 0) return 0;
        const res = stack[0];
        if (typeof res !== 'number' || isNaN(res)) throw new Error("Math ERROR");
        return res;
    }
}

class CalculatorApp {
    constructor() {
        this.state = new CalculatorState();
        this.nav = new NavigationEngine(this.state);
        
        this.mathDisplayEl = document.getElementById('math-display');
        this.resultDisplayEl = document.getElementById('result-display');
        
        this.initEvents();
        this.render();
    }

    initEvents() {
        document.querySelector('.keypad').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;

            const action = btn.dataset.action;
            const value = btn.dataset.value;

            this.handleAction(action, value);
            this.render();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') this.handleAction('digit', e.key);
            else if (['+', '-', '*', '/'].includes(e.key)) this.handleAction('op', e.key);
            else if (e.key === '.') this.handleAction('digit', '.');
            else if (e.key === 'ArrowLeft') this.nav.navigateLeft();
            else if (e.key === 'ArrowRight') this.nav.navigateRight();
            else if (e.key === 'ArrowUp') this.nav.navigateUp();
            else if (e.key === 'ArrowDown') this.nav.navigateDown();
            else if (e.key === 'Backspace') this.deleteNearCursor();
            else if (e.key === 'Enter' || e.key === '=') this.calculateResult();
            else if (e.key === 'Escape') this.clearAll();

            this.render();
        });
    }

    handleAction(action, value) {
        const isModifier = action === 'shift' || action === 'alpha';

        switch (action) {
            case 'digit':
                this.insertNode(new ASTNode('number', { value }));
                break;
            case 'op':
                this.insertNode(new ASTNode('operator', { value }));
                break;
            case 'const':
            case 'ans':
                this.insertNode(new ASTNode('symbol', { value: value || 'Ans' }));
                break;
            case 'var':
                this.insertNode(new ASTNode('variable', { name: value }));
                break;
            case 'calc':
                if (this.state.alpha) {
                    this.insertNode(new ASTNode('symbol', { value: '=' }));
                } else {
                    this.calculateResult();
                }
                break;
            case 'system':
                this.clearAll();
                const sysNode = createSystemNode();
                this.insertNode(sysNode);
                break;
            case 'fraction':
                this.insertNode(createFraction());
                break;
            case 'sqrt':
                this.insertNode(createSqrt());
                break;
            case 'power':
                this.insertNode(createPower());
                break;
            case 'func':
                this.insertNode(createFunction(value));
                break;
            case 'char':
                if (value === '(') this.insertNode(createGroup());
                break;
            case 'nav-left': this.nav.navigateLeft(); break;
            case 'nav-right': this.nav.navigateRight(); break;
            case 'nav-up': this.nav.navigateUp(); break;
            case 'nav-down': this.nav.navigateDown(); break;
            case 'delete': this.deleteNearCursor(); break;
            case 'clear-all': this.clearAll(); break;
            case 'calculate': this.calculateResult(); break;
            case 'toggle-angle':
                const modes = ['DEG', 'RAD', 'GRAD'];
                this.state.angleMode = modes[(modes.indexOf(this.state.angleMode) + 1) % 3];
                break;
            case 'toggle-approx':
                this.state.showApprox = !this.state.showApprox;
                this.updateResultDisplay();
                break;
            case 'shift':
                this.state.shift = !this.state.shift;
                this.state.alpha = false;
                break;
            case 'alpha':
                this.state.alpha = !this.state.alpha;
                this.state.shift = false;
                break;
        }

        if (!isModifier) {
            this.state.shift = false;
            this.state.alpha = false;
        }
    }

    insertNode(newNode) {
        const currentSlot = ASTUtils.findSlot(this.state.rootSlot, this.state.cursor.slotId);
        if (!currentSlot) return;

        currentSlot.children.splice(this.state.cursor.offset, 0, newNode);

        if (newNode.type === 'fraction') {
            this.state.cursor.slotId = newNode.num.id;
            this.state.cursor.offset = 0;
        } else if (newNode.type === 'sqrt') {
            this.state.cursor.slotId = newNode.radicand.id;
            this.state.cursor.offset = 0;
        } else if (newNode.type === 'power') {
            this.state.cursor.slotId = newNode.exp.id;
            this.state.cursor.offset = 0;
        } else if (newNode.type === 'func') {
            this.state.cursor.slotId = newNode.arg.id;
            this.state.cursor.offset = 0;
        } else if (newNode.type === 'group') {
            this.state.cursor.slotId = newNode.expr.id;
            this.state.cursor.offset = 0;
        } else if (newNode.type === 'system') {
            this.state.cursor.slotId = newNode.a.id;
            this.state.cursor.offset = 0;
        } else {
            this.state.cursor.offset++;
        }
    }

    deleteNearCursor() {
        const { slotId, offset } = this.state.cursor;
        const currentSlot = ASTUtils.findSlot(this.state.rootSlot, slotId);
        if (!currentSlot) return;

        if (offset > 0) {
            currentSlot.children.splice(offset - 1, 1);
            this.state.cursor.offset--;
        } else {
            const ownerNode = ASTUtils.getSlotOwnerNode(this.state.rootSlot, slotId);
            if (ownerNode) {
                const parentSlotInfo = ASTUtils.getNodeParentSlot(this.state.rootSlot, ownerNode.id);
                if (parentSlotInfo) {
                    parentSlotInfo.slot.children.splice(parentSlotInfo.index, 1);
                    this.state.cursor.slotId = parentSlotInfo.slot.id;
                    this.state.cursor.offset = parentSlotInfo.index;
                }
            }
        }
    }

    clearAll() {
        this.state.resetExpression();
        this.resultDisplayEl.textContent = '0';
    }

    calculateResult() {
        try {
            const res = EvaluationEngine.evaluate(this.state.rootSlot, this.state);
            if (typeof res === 'number') {
                this.state.ans = res;
            } else if (typeof res === 'object' && res !== null) {
                if ('x' in res && typeof res.x === 'number') this.state.vars.X = res.x;
                if ('y' in res && typeof res.y === 'number') this.state.vars.Y = res.y;
            }
            this.state.lastResult = res;
            this.updateResultDisplay();
        } catch (err) {
            this.resultDisplayEl.textContent = err.message || "Syntax ERROR";
        }
    }

    formatVal(v) {
        if (this.state.showApprox) {
            return Number.isInteger(v) ? v.toString() : v.toFixed(8).replace(/\.?0+$/, "");
        } else {
            const frac = ASTUtils.floatToFraction(v);
            if (frac && frac.den !== 1) {
                return `${frac.num}/${frac.den}`;
            } else {
                return Number.isInteger(v) ? v.toString() : v.toFixed(8).replace(/\.?0+$/, "");
            }
        }
    }

    updateResultDisplay() {
        if (this.state.lastResult === null) return;
        const res = this.state.lastResult;

        if (typeof res === 'string') {
            this.resultDisplayEl.textContent = res;
        } else if (typeof res === 'object' && res !== null) {
            const keys = Object.keys(res);
            if (keys.length === 2 && 'x' in res && 'y' in res) {
                this.resultDisplayEl.textContent = `x=${this.formatVal(res.x)}, y=${this.formatVal(res.y)}`;
            } else if (keys.length === 1) {
                const k = keys[0];
                this.resultDisplayEl.textContent = `${k}=${this.formatVal(res[k])}`;
            }
        } else {
            this.resultDisplayEl.textContent = this.formatVal(res);
        }
    }

    render() {
        this.mathDisplayEl.innerHTML = '';
        const domTree = ExpressionRenderer.render(this.state.rootSlot, this.state.cursor);
        this.mathDisplayEl.appendChild(domTree);

        document.getElementById('ind-shift').classList.toggle('active', this.state.shift);
        document.getElementById('ind-alpha').classList.toggle('active', this.state.alpha);
        document.getElementById('ind-m').classList.toggle('active', false);
        const angleEl = document.getElementById('ind-angle');
        angleEl.textContent = this.state.angleMode;
        angleEl.classList.add('active');

        const cursorEl = this.mathDisplayEl.querySelector('.cursor');
        if (cursorEl) {
            cursorEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        }
    }
}

document.addEventListener('DOMContentLoaded', () => {
    window.app = new CalculatorApp();
});
    </script>
